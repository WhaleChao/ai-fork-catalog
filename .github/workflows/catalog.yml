name: MAGI Fork Catalog

on:
  schedule:
    # 10:17 Asia/Taipei, away from the top-of-hour Actions rush.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview reads only; bootstrap processes the fixed first batch"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - bootstrap
          - daily
          - refresh

permissions:
  contents: write

concurrency:
  group: magi-fork-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORK_PAT: ${{ secrets.FORK_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'daily' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog
        id: run
        shell: bash
        run: |
          set +e
          python catalog.py --mode "$MODE"
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Publish catalog and report
        if: env.MODE != 'preview'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/report.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update fork catalog and sync report"
            git push
          fi
      - name: Report API failures
        if: steps.run.outputs.result != '0'
        run: exit 1
